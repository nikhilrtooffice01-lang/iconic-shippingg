<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | ICONIC SHIPPING SERVICES</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/extras.css">
<link rel="stylesheet" href="/modern.css">
<style>
.admin-login .login-box { border-top: 4px solid #1a56db; }
.admin-login h1 { color: #0a2540; }
</style>
</head>
<body class="login-page admin-login">
<div class="login-box">
  <a class="brand" href="/">
    <span class="logo-mark">⚓</span>
    <span class="logo-text"><b>ICONIC</b><small>ADMIN</small></span>
  </a>

  <h1>Admin Login</h1>
  <p style="text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px">Restricted access for authorized staff only.</p>

  <form id="login">
    <input type="email" name="email" placeholder="Admin Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button class="btn primary">Login to Dashboard</button>
  </form>
  <div id="msg"></div>
  <p style="margin-top:20px;font-size:13px;color:var(--muted)">Customer? <a href="/login.html">Customer Login</a></p>
</div>
<script src="/config.js"></script>
<script>
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "Signing in…";
  const r = await fetch("/api/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
  });
  const d = await r.json();
  if (!r.ok) { msg.textContent = d.message || "Login failed"; return; }
  if (d.user?.role !== "admin") {
    msg.textContent = "This account is not an admin. Use Customer Login.";
    return;
  }
  location.href = "/admin.html";
});
</script>
</body>
</html>
