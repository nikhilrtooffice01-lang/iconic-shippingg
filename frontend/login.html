<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Login | ICONIC SHIPPING SERVICES</title>
<meta name="description" content="Login to your ICONIC SHIPPING SERVICES customer account to view enquiries and quotations.">
<link rel="canonical" href="https://iconicshipping.org/login.html">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/extras.css">
<link rel="stylesheet" href="/modern.css">
</head>
<body class="login-page">
<div class="login-box">
  <a class="brand" href="/">
    <span class="logo-mark">⚓</span>
    <span class="logo-text"><b>ICONIC</b><small>SHIPPING SERVICES</small></span>
  </a>

  <div id="registerBox" hidden>
    <h2>Create Customer Account</h2>
    <form id="register">
      <input name="name" placeholder="Full name" required>
      <input name="company" placeholder="Company">
      <input name="phone" placeholder="Phone">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password (10+ characters)" minlength="10" required>
      <button class="btn primary">Create Account</button>
    </form>
    <p>Already registered? <a href="#" data-view="login">Login</a></p>
  </div>

  <div id="loginBox">
    <h1>Customer Login</h1>
    <form id="login">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn primary">Login</button>
    </form>
    <p><a href="#" data-view="forgot">Forgot password?</a></p>
    <p>New customer? <a href="#" data-view="register">Create account</a></p>
  </div>

  <div id="forgotBox" hidden>
    <h2>Forgot Password</h2>
    <p>Enter your account email. We will send you a link to reset your password.</p>
    <form id="forgotForm">
      <input type="email" name="email" placeholder="Email" required>
      <button class="btn primary">Send Reset Link</button>
    </form>
    <p><a href="#" data-view="login">Back to login</a></p>
  </div>

  <div id="resetBox" hidden>
    <h2>Set New Password</h2>
    <form id="resetForm">
      <input type="password" name="password" placeholder="New password (10+ characters)" minlength="10" required>
      <input type="password" name="confirm" placeholder="Confirm new password" minlength="10" required>
      <button class="btn primary">Update Password</button>
    </form>
  </div>
  <div id="msg"></div>
  <p style="margin-top:20px;font-size:13px;color:var(--muted)">Admin? <a href="/admin-login.html">Admin Login</a></p>
</div>
<script src="/config.js"></script>
<script src="/layout.js"></script>
<script src="/whatsapp.js"></script>
<script src="/login.js"></script>
<script src="/fx.js"></script>
</body>
</html>
